[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "liveimport-autoload"
version = "1.0.0"
description = "Import LiveImport automatically when IPython and Jupyter kernels start."
readme = "README.md"
authors = [{ name = "Edward Screven" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
]
keywords = ["notebook", "jupyter", "ipython", "import", "reload", "autoreload"]
classifiers = [
    "Operating System :: OS Independent",
    "Framework :: IPython",
    "Framework :: Jupyter",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/escreven/liveimport"
Repository = "https://github.com/escreven/liveimport"
Documentation = "https://liveimport.readthedocs.io"
Issues = "https://github.com/escreven/liveimport/issues"

[tool.setuptools]
packages = []
include-package-data = false

[tool.setuptools.data-files]
"etc/ipython/startup" = ["startup/00-liveimport.py"]
