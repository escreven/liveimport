#
# See .github/workflows/README.md.
#

name: Autoload Test

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  OLDEST_IPYTHON_VERSION: '7.23.1'

jobs:
  full:
    name: Full
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        dependencies: [ 'oldest', 'latest' ]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout LiveImport
      uses: actions/checkout@v5

    - name: Prepare Pip Cache Key
      run: |
        date -u +'%G-%V' > .pip-cache-key
        echo "${{ matrix.dependencies }}" >> .pip-cache-key

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: 'pip'
        cache-dependency-path: |
          .pip-cache-key

    - name: Run Autoload Tests
      run: |
        if [[ '${{ matrix.dependencies }}' == oldest ]]; then
          bash autoload/test-autoload.sh --no_venv \
            --ipython="$OLDEST_IPYTHON_VERSION"
        else
          bash autoload/test-autoload.sh --no_venv
        fi
